# Сколько браузер может хранить файл. Сборки Expo с хешем в имени не меняются —
# их кешируем навсегда. Всё остальное (HTML, sw.js, manifest, иконки) браузер
# перепроверяет при каждом открытии: по ETag это дешёвый ответ 304, зато после
# деплоя сразу приходит новая версия, а не старый HTML со старыми скриптами
map $uri $nous_cache_control {
    "~^/_expo/static/"                        "public, max-age=31536000, immutable";
    "~^/assets/.+\.[0-9a-f]{32}\.[a-z0-9]+$"  "public, max-age=31536000, immutable";
    default                                   "no-cache";
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Все заголовки — только здесь: add_header внутри location отменяет
    # заголовки уровня server, и на части файлов они молча пропадали
    add_header Cache-Control $nous_cache_control always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # SPA routing - все запросы перенаправляем на index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
