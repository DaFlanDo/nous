name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # Backend: API-тесты против запущенного сервера + тесты в процессе
  test-backend:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: nous_ci
      JWT_SECRET: ci-jwt-secret
      ENCRYPTION_KEY: ci-encryption-key
      OPENAI_API_KEY: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            tests/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r tests/requirements.txt

      - name: Start backend server
        working-directory: backend
        run: |
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && exit 0; sleep 1; done
          echo "Backend не поднялся"; exit 1

      - name: Run tests
        run: pytest -c config/pytest.ini tests
        env:
          API_BASE_URL: http://localhost:8000

  # Frontend: типы, линтер, веб-сборка — любая ошибка роняет CI
  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: yarn lint

      - name: Build web
        working-directory: frontend
        run: yarn build:web
        env:
          EXPO_PUBLIC_BACKEND_URL: http://localhost:8000
          EXPO_PUBLIC_GOOGLE_CLIENT_ID: test-client-id.apps.googleusercontent.com
